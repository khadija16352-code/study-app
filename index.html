<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Quest</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffd9eb,#ddd8ff);
    color:#29263d;
}

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.card{
    width:100%;
    max-width:1050px;
    min-height:680px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(20px);
    border-radius:32px;
    box-shadow:0 25px 70px rgba(50,30,90,.15);
    display:grid;
    grid-template-columns:380px 1fr;
    overflow:hidden;
}

/* =========================
   PREVIEW
========================= */

.preview{
    background:linear-gradient(160deg,#ffd5e9,#e8dcff);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px;
    position:relative;
}

.preview h1{
    font-size:25px;
    margin-bottom:10px;
}

.preview p{
    color:#777;
    margin-bottom:20px;
}

.character-box{
    width:260px;
    height:390px;
    border-radius:30px;
    background:rgba(255,255,255,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

/*
الصورة عبارة عن 3 أعمدة × صفين.
كل اختيار بياخد جزء من الصورة.
*/

.character{
    width:260px;
    height:390px;
    background-image:url("characters.png");
    background-size:300% 200%;
    background-repeat:no-repeat;
    transition:.3s;
}

/* 6 characters */

.c1{background-position:0% 0%;}
.c2{background-position:50% 0%;}
.c3{background-position:100% 0%;}
.c4{background-position:0% 100%;}
.c5{background-position:50% 100%;}
.c6{background-position:100% 100%;}

.selected-name{
    margin-top:18px;
    font-weight:bold;
    font-size:18px;
}

/* =========================
   CUSTOMIZATION
========================= */

.customize{
    padding:42px;
    overflow-y:auto;
    max-height:680px;
}

.logo{
    font-size:30px;
    font-weight:800;
    margin-bottom:7px;
}

.subtitle{
    color:#777;
    margin-bottom:30px;
}

.section{
    margin-bottom:27px;
}

.section-title{
    font-weight:bold;
    font-size:16px;
    margin-bottom:12px;
}

.gender{
    display:flex;
    gap:10px;
}

.gender button{
    flex:1;
    padding:13px;
    border:2px solid #eee;
    border-radius:14px;
    background:white;
    cursor:pointer;
    font-size:15px;
}

.gender button.active{
    border-color:#9b75ff;
    background:#f5efff;
}

/* CHARACTER OPTIONS */

.options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.option{
    min-height:100px;
    border:2px solid #eee;
    background:white;
    border-radius:17px;
    cursor:pointer;
    transition:.2s;
    padding:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.option:hover{
    transform:translateY(-3px);
}

.option.active{
    border-color:#9b75ff;
    background:#f5efff;
}

.mini-character{
    width:70px;
    height:75px;
    background-image:url("characters.png");
    background-size:300% 200%;
    background-repeat:no-repeat;
}

.m1{background-position:0% 0%;}
.m2{background-position:50% 0%;}
.m3{background-position:100% 0%;}
.m4{background-position:0% 100%;}
.m5{background-position:50% 100%;}
.m6{background-position:100% 100%;}

/* OTHER OPTIONS */

.item-options{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

.item{
    min-width:75px;
    padding:13px 10px;
    border:2px solid #eee;
    background:white;
    border-radius:13px;
    cursor:pointer;
    text-align:center;
    font-size:24px;
}

.item span{
    display:block;
    font-size:11px;
    margin-top:5px;
}

.item.active{
    border-color:#ff78b5;
    background:#fff0f7;
}

/* NAME */

input,
select{
    width:100%;
    padding:14px;
    border:2px solid #eee;
    border-radius:13px;
    outline:none;
    font-size:15px;
    background:white;
}

input:focus,
select:focus{
    border-color:#9b75ff;
}

.continue{
    width:100%;
    border:0;
    padding:16px;
    border-radius:15px;
    background:#806cff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.continue:hover{
    transform:translateY(-2px);
}

/* MOBILE */

@media(max-width:800px){

    body{
        overflow:auto;
    }

    .card{
        grid-template-columns:1fr;
    }

    .preview{
        min-height:480px;
    }

    .customize{
        max-height:none;
        padding:28px 22px;
    }
}
</style>
</head>

<body>

<div class="page">

<div class="card">

<!-- =========================
     CHARACTER PREVIEW
========================= -->

<div class="preview">

    <h1>✨ Your Character</h1>

    <p>Make your study buddy yours!</p>

    <div class="character-box">
        <div id="mainCharacter" class="character c1"></div>
    </div>

    <div id="selectedName" class="selected-name">
        Character 1
    </div>

</div>


<!-- =========================
     CUSTOMIZATION
========================= -->

<div class="customize">

    <div class="logo">
        📚 Study Quest
    </div>

    <div class="subtitle">
        Create your profile & choose your style
    </div>


    <!-- LANGUAGE -->

    <div class="section">

        <div class="section-title">
            🌍 Language
        </div>

        <div class="gender">

            <button class="active">
                🇬🇧 English
            </button>

            <button>
                🇪🇬 العربية
            </button>

        </div>

    </div>


    <!-- BASIC INFO -->

    <div class="section">

        <div class="section-title">
            👤 Your information
        </div>

        <input
            id="name"
            type="text"
            placeholder="Your name">

        <br><br>

        <input
            id="age"
            type="number"
            placeholder="Your age">

        <br><br>

        <select id="school">

            <option value="">
                Select your school year
            </option>

            <option>Primary 1</option>
            <option>Primary 2</option>
            <option>Primary 3</option>
            <option>Primary 4</option>
            <option>Primary 5</option>
            <option>Primary 6</option>

            <option>Preparatory 1</option>
            <option>Preparatory 2</option>
            <option>Preparatory 3</option>

            <option>Secondary 1</option>
            <option>Secondary 2</option>
            <option>Secondary 3</option>

        </select>

    </div>


    <!-- GENDER -->

    <div class="section">

        <div class="section-title">
            👤 Character type
        </div>

        <div class="gender">

            <button
                id="girlButton"
                class="active"
                onclick="setGender('girl')">

                👧 Girl

            </button>

            <button
                id="boyButton"
                onclick="setGender('boy')">

                👦 Boy

            </button>

        </div>

    </div>


    <!-- CHARACTER -->

    <div class="section">

        <div class="section-title">
            👤 Choose your character
        </div>

        <div class="options">

            <button class="option active" onclick="selectCharacter(1)">
                <div class="mini-character m1"></div>
                <small>Girl 1</small>
            </button>

            <button class="option" onclick="selectCharacter(2)">
                <div class="mini-character m2"></div>
                <small>Girl 2</small>
            </button>

            <button class="option" onclick="selectCharacter(3)">
                <div class="mini-character m3"></div>
                <small>Girl 3</small>
            </button>

            <button class="option" onclick="selectCharacter(4)">
                <div class="mini-character m4"></div>
                <small>Boy 1</small>
            </button>

            <button class="option" onclick="selectCharacter(5)">
                <div class="mini-character m5"></div>
                <small>Boy 2</small>
            </button>

            <button class="option" onclick="selectCharacter(6)">
                <div class="mini-character m6"></div>
                <small>Boy 3</small>
            </button>

        </div>

    </div>


    <!-- HAIR -->

    <div class="section">

        <div class="section-title">
            💇 Hair
        </div>

        <div class="item-options">

            <button class="item active">
                💇
                <span>Style 1</span>
            </button>

            <button class="item">
                👩‍🦱
                <span>Style 2</span>
            </button>

            <button class="item">
                👩‍🦰
                <span>Style 3</span>
            </button>

            <button class="item">
                👱
                <span>Style 4</span>
            </button>

        </div>

    </div>


    <!-- OUTFIT -->

    <div class="section">

        <div class="section-title">
            👕 Outfit
        </div>

        <div class="item-options">

            <button class="item active">
                👕
                <span>Casual</span>
            </button>

            <button class="item">
                👗
                <span>Dress</span>
            </button>

            <button class="item">
                🧥
                <span>Jacket</span>
            </button>

            <button class="item">
                👚
                <span>Style 4</span>
            </button>

        </div>

    </div>


    <!-- SHOES -->

    <div class="section">

        <div class="section-title">
            👟 Shoes
        </div>

        <div class="item-options">

            <button class="item active">
                👟
                <span>Sneakers</span>
            </button>

            <button class="item">
                👢
                <span>Boots</span>
            </button>

            <button class="item">
                🥿
                <span>Classic</span>
            </button>

        </div>

    </div>


    <!-- ACCESSORIES -->

    <div class="section">

        <div class="section-title">
            ✨ Accessories
        </div>

        <div class="item-options">

            <button class="item">
                👓
                <span>Glasses</span>
            </button>

            <button class="item">
                🎒
                <span>Bag</span>
            </button>

            <button class="item">
                🎧
                <span>Headphones</span>
            </button>

            <button class="item">
                🎀
                <span>Bow</span>
            </button>

        </div>

    </div>


    <button class="continue" onclick="finishProfile()">
        Continue →
    </button>

</div>

</div>
</div>


<script>

/* =========================
   CHARACTER SELECTION
========================= */

let selectedCharacter = 1;
let gender = "girl";

function selectCharacter(number){

    selectedCharacter = number;

    const character =
        document.getElementById("mainCharacter");

    character.className =
        "character c" + number;

    document.getElementById("selectedName").textContent =
        "Character " + number;

    document
        .querySelectorAll(".option")
        .forEach((button,index)=>{

            button.classList.toggle(
                "active",
                index + 1 === number
            );

        });
}


/* =========================
   GENDER
========================= */

function setGender(type){

    gender = type;

    const girl =
        document.getElementById("girlButton");

    const boy =
        document.getElementById("boyButton");

    girl.classList.toggle(
        "active",
        type === "girl"
    );

    boy.classList.toggle(
        "active",
        type === "boy"
    );

    /*
    حاليا بنعرض الشخصيات كلها.
    بعدين هنخلي Girl تعرض البنات فقط
    وBoy يعرض الأولاد فقط.
    */

}


/* =========================
   ITEM SELECTION
========================= */

document.querySelectorAll(".item").forEach(item => {

    item.addEventListener("click",function(){

        const group =
            this.parentElement;

        group
            .querySelectorAll(".item")
            .forEach(x =>
                x.classList.remove("active")
            );

        this.classList.add("active");

    });

});


/* =========================
   SAVE PROFILE
========================= */

function finishProfile(){

    const name =
        document.getElementById("name").value.trim();

    const age =
        document.getElementById("age").value;

    const school =
        document.getElementById("school").value;

    if(!name || !age || !school){

        alert("Please complete your information ❤️");

        return;
    }

    localStorage.setItem(
        "studyQuestName",
        name
    );

    localStorage.setItem(
        "studyQuestAge",
        age
    );

    localStorage.setItem(
        "studyQuestSchool",
        school
    );

    localStorage.setItem(
        "studyQuestGender",
        gender
    );

    localStorage.setItem(
        "studyQuestCharacter",
        selectedCharacter
    );

    alert(
        "Your character is ready! 🎉"
    );
}

</script>

</body>
</html>
