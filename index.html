<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Quest</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:
        linear-gradient(135deg,#ffd8ec,#e2d9ff);
    color:#29263d;
}

.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.creator{
    width:100%;
    max-width:1150px;
    min-height:720px;
    background:#fff;
    border-radius:30px;
    overflow:hidden;
    display:grid;
    grid-template-columns:430px 1fr;
    box-shadow:0 20px 60px rgba(70,40,100,.18);
}


/* =========================
   PREVIEW
========================= */

.preview{
    background:
        linear-gradient(160deg,#ffd3e8,#e2d5ff);

    padding:30px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.preview h1{
    font-size:29px;
    margin-bottom:7px;
}

.preview p{
    color:#777;
    margin-bottom:20px;
}

.stage{
    width:320px;
    height:470px;

    background:
        rgba(255,255,255,.6);

    border-radius:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    position:relative;
}

.previewCharacter{
    position:relative;
    width:260px;
    height:420px;
}


/* =========================
   TEMP CHARACTER
========================= */

.body{
    position:absolute;

    width:140px;
    height:190px;

    left:60px;
    top:155px;

    border-radius:60px 60px 25px 25px;

    background:#f59ac3;
}

.head{
    position:absolute;

    width:120px;
    height:125px;

    left:70px;
    top:45px;

    border-radius:50%;

    background:#f2b48d;

    z-index:3;
}

.face{
    position:absolute;

    left:104px;
    top:88px;

    font-size:30px;

    z-index:10;
}

.hair{
    position:absolute;

    left:55px;
    top:30px;

    width:150px;
    height:150px;

    border-radius:70px;

    background:#40271f;

    z-index:5;
}

.legs{
    position:absolute;

    top:330px;

    width:43px;
    height:80px;

    background:#f2b48d;

    border-radius:20px;
}

.leg1{
    left:82px;
}

.leg2{
    left:137px;
}

.previewShoes{
    position:absolute;

    top:395px;

    font-size:35px;

    z-index:10;
}

.shoe1{
    left:65px;
}

.shoe2{
    left:125px;
}

.previewBag{
    position:absolute;

    right:15px;
    top:205px;

    width:75px;
    max-height:100px;

    object-fit:contain;

    z-index:20;
}

.previewHijab{
    position:absolute;

    left:48px;
    top:20px;

    width:165px;
    height:170px;

    object-fit:contain;

    z-index:8;
}

.previewAccessory{
    position:absolute;

    left:112px;
    top:90px;

    font-size:30px;

    z-index:15;
}


/* =========================
   CONTROLS
========================= */

.controls{
    padding:38px;

    overflow-y:auto;

    max-height:720px;
}

.logo{
    font-size:30px;
    font-weight:800;
}

.subtitle{
    color:#777;
    margin-top:5px;
    margin-bottom:25px;
}

.section{
    margin-bottom:24px;
}

.title{
    font-weight:bold;
    margin-bottom:12px;
}

.gender{
    display:flex;
    gap:10px;
}

.gender button{
    flex:1;

    padding:14px;

    border:2px solid #eee;

    background:#fff;

    border-radius:14px;

    cursor:pointer;

    font-size:15px;
}

.gender button.active{
    border-color:#8d70ff;
    background:#f3efff;
}


/* =========================
   OPTIONS
========================= */

.options{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.option{
    min-width:100px;
    min-height:85px;

    padding:8px;

    border:2px solid #eee;

    border-radius:15px;

    background:#fff;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    transition:.2s;
}

.option:hover{
    transform:translateY(-3px);
}

.option.active{
    border-color:#8d70ff;

    background:#f3efff;
}

.option img{
    width:80px;
    height:55px;

    object-fit:contain;
}

.option .emoji{
    font-size:28px;
}

.option span:last-child{
    font-size:12px;
}


/* =========================
   INPUTS
========================= */

.info{
    display:grid;
    gap:10px;
}

input,
select{

    width:100%;

    padding:14px;

    border:2px solid #eee;

    border-radius:13px;

    font-size:15px;

    outline:none;
}


/* =========================
   BUTTON
========================= */

.continue{

    width:100%;

    padding:16px;

    border:0;

    border-radius:15px;

    background:#806cff;

    color:#fff;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    margin-top:5px;
}


@media(max-width:800px){

    .creator{
        grid-template-columns:1fr;
    }

    .preview{
        min-height:560px;
    }

    .controls{
        max-height:none;
    }

}

</style>
</head>


<body>

<div class="page">

<div class="creator">


<!-- =================================
     PREVIEW
================================= -->

<div class="preview">

<h1>✨ Your Character</h1>

<p>Build your own study buddy</p>


<div class="stage">

<div class="previewCharacter">

    <div class="hair" id="hair"></div>

    <div class="head"></div>

    <div class="face">😊</div>

    <div class="body" id="body"></div>

    <div class="legs leg1"></div>
    <div class="legs leg2"></div>

    <img
        id="hijabPreview"
        class="previewHijab"
        style="display:none"
    >

    <img
        id="bagPreview"
        class="previewBag"
        style="display:none"
    >

    <div
        id="accessoryPreview"
        class="previewAccessory">
    </div>

    <div
        id="shoe1"
        class="previewShoes shoe1">
        👟
    </div>

    <div
        id="shoe2"
        class="previewShoes shoe2">
        👟
    </div>

</div>

</div>

</div>



<!-- =================================
     CONTROLS
================================= -->

<div class="controls">

<div class="logo">
📚 Study Quest
</div>

<div class="subtitle">
Create your profile and customize your character.
</div>



<!-- LANGUAGE -->

<div class="section">

<div class="title">
🌍 Language
</div>

<div class="gender">

<button class="active">
🇬🇧 English
</button>

<button>
🇪🇬 العربية
</button>

</div>

</div>



<!-- INFORMATION -->

<div class="section">

<div class="title">
👤 Your information
</div>

<div class="info">

<input
    id="name"
    placeholder="Your name"
>

<input
    id="age"
    type="number"
    placeholder="Your age"
>

<select id="school">

<option value="">
Select your school year
</option>

<option>Primary 1</option>
<option>Primary 2</option>
<option>Primary 3</option>
<option>Primary 4</option>
<option>Primary 5</option>
<option>Primary 6</option>

<option>Preparatory 1</option>
<option>Preparatory 2</option>
<option>Preparatory 3</option>

<option>Secondary 1</option>
<option>Secondary 2</option>
<option>Secondary 3</option>

</select>

</div>

</div>



<!-- GENDER -->

<div class="section">

<div class="title">
👤 Character type
</div>

<div class="gender">

<button
    id="girlBtn"
    class="active"
    onclick="setGender('girl')">

👧 Girl

</button>


<button
    id="boyBtn"
    onclick="setGender('boy')">

👦 Boy

</button>

</div>

</div>



<!-- CHARACTER -->

<div class="section">

<div class="title">
🧍 Choose your character
</div>

<div class="options">

<button
    class="option active"
    onclick="selectOption(this)">

<span class="emoji">👧</span>
<span>Girl 1</span>

</button>


<button
    class="option"
    onclick="selectOption(this)">

<span class="emoji">👩</span>
<span>Girl 2</span>

</button>


<button
    class="option"
    onclick="selectOption(this)">

<span class="emoji">👱‍♀️</span>
<span>Girl 3</span>

</button>

</div>

</div>



<!-- HAIR -->

<div class="section">

<div class="title">
💇 Hair
</div>

<div class="options">

<button
    class="option active"
    onclick="changeHair('#40271f',this)">

<span class="emoji">💇</span>
<span>Style 1</span>

</button>


<button
    class="option"
    onclick="changeHair('#171717',this)">

<span class="emoji">👩‍🦱</span>
<span>Curly</span>

</button>


<button
    class="option"
    onclick="changeHair('#8b4b27',this)">

<span class="emoji">👩‍🦰</span>
<span>Brown</span>

</button>


<button
    class="option"
    onclick="changeHair('#d39b51',this)">

<span class="emoji">👱</span>
<span>Blonde</span>

</button>

</div>

</div>



<!-- OUTFIT -->

<div class="section">

<div class="title">
👗 Outfit
</div>

<div class="options">

<button
    class="option active"
    onclick="changeOutfit('#f59ac3',this)">

<span class="emoji">👗</span>
<span>Pink</span>

</button>


<button
    class="option"
    onclick="changeOutfit('#9675e8',this)">

<span class="emoji">💜</span>
<span>Purple</span>

</button>


<button
    class="option"
    onclick="changeOutfit('#55a7e8',this)">

<span class="emoji">💙</span>
<span>Blue</span>

</button>


<button
    class="option"
    onclick="changeOutfit('#62bb96',this)">

<span class="emoji">💚</span>
<span>Green</span>

</button>

</div>

</div>



<!-- ACCESSORIES -->

<div class="section">

<div class="title">
✨ Accessories
</div>

<div class="options">

<button
    class="option"
    onclick="changeAccessory('👓',this)">

<span class="emoji">👓</span>
<span>Glasses</span>

</button>


<button
    class="option"
    onclick="changeAccessory('🎀',this)">

<span class="emoji">🎀</span>
<span>Bow</span>

</button>


<button
    class="option"
    onclick="changeAccessory('🎧',this)">

<span class="emoji">🎧</span>
<span>Headphones</span>

</button>


<button
    class="option"
    onclick="changeAccessory('',this)">

<span class="emoji">🚫</span>
<span>None</span>

</button>

</div>

</div>



<!-- HIJAB -->

<div class="section">

<div class="title">
🧕 Hijab
</div>

<div class="options">


<button
    class="option"
    onclick="changeHijab('hijab1.jpg',this)">

<img src="hijab1.jpg">

<span>Hijab 1</span>

</button>


<button
    class="option"
    onclick="changeHijab('hijab2.jpg',this)">

<img src="hijab2.jpg">

<span>Hijab 2</span>

</button>


<button
    class="option"
    onclick="changeHijab('hijab3.jpg',this)">

<img src="hijab3.jpg">

<span>Hijab 3</span>

</button>


<button
    class="option"
    onclick="changeHijab('',this)">

<span class="emoji">🚫</span>

<span>None</span>

</button>

</div>

</div>



<!-- BAGS -->

<div class="section">

<div class="title">
🎒 Bags
</div>

<div class="options">


<button
    class="option"
    onclick="changeBag('bag1.jpg',this)">

<img src="bag1.jpg">

<span>Crossbody</span>

</button>


<button
    class="option"
    onclick="changeBag('bag2.jpg',this)">

<img src="bag2.jpg">

<span>Shoulder Bag</span>

</button>


<button
    class="option"
    onclick="changeBag('',this)">

<span class="emoji">🎒</span>

<span>Backpack</span>

</button>


<button
    class="option"
    onclick="changeBag('',this)">

<span class="emoji">🚫</span>

<span>None</span>

</button>

</div>

</div>



<!-- SHOES -->

<div class="section">

<div class="title">
👟 Shoes
</div>

<div class="options">


<button
    class="option"
    onclick="changeShoes('shoes1.jpg',this)">

<img src="shoes1.jpg">

<span>Black High-top</span>

</button>


<button
    class="option"
    onclick="changeShoes('emoji',this)">

<span class="emoji">👟</span>

<span>Sneakers</span>

</button>


<button
    class="option"
    onclick="changeShoes('boots',this)">

<span class="emoji">👢</span>

<span>Boots</span>

</button>

</div>

</div>



<button
    class="continue"
    onclick="finish()">

Continue →

</button>


</div>

</div>

</div>



<script>


/* =================================
   OPTION SELECT
================================= */

function selectOption(button){

    button
    .parentElement
    .querySelectorAll(".option")
    .forEach(item => {

        item.classList.remove("active");

    });

    button.classList.add("active");
}



/* =================================
   GENDER
================================= */

function setGender(type){

    const girl =
        document.getElementById("girlBtn");

    const boy =
        document.getElementById("boyBtn");

    if(type === "girl"){

        girl.classList.add("active");
        boy.classList.remove("active");

    }else{

        boy.classList.add("active");
        girl.classList.remove("active");

        document
        .getElementById("body")
        .style.background="#55a7e8";

    }

}



/* =================================
   HAIR
================================= */

function changeHair(color,button){

    document
    .getElementById("hair")
    .style.background=color;

    selectOption(button);
}



/* =================================
   OUTFIT
================================= */

function changeOutfit(color,button){

    document
    .getElementById("body")
    .style.background=color;

    selectOption(button);
}



/* =================================
   ACCESSORY
================================= */

function changeAccessory(value,button){

    document
    .getElementById("accessoryPreview")
    .textContent=value;

    selectOption(button);
}



/* =================================
   HIJAB
================================= */

function changeHijab(file,button){

    const image =
        document.getElementById("hijabPreview");

    if(file){

        image.src=file;

        image.style.display="block";

    }else{

        image.style.display="none";

    }

    selectOption(button);
}



/* =================================
   BAG
================================= */

function changeBag(file,button){

    const image =
        document.getElementById("bagPreview");

    if(file){

        image.src=file;

        image.style.display="block";

    }else{

        image.style.display="none";

    }

    selectOption(button);
}



/* =================================
   SHOES
================================= */

function changeShoes(file,button){

    const shoe1 =
        document.getElementById("shoe1");

    const shoe2 =
        document.getElementById("shoe2");

    if(file === "emoji"){

        shoe1.textContent="👟";
        shoe2.textContent="👟";

    }

    else if(file === "boots"){

        shoe1.textContent="👢";
        shoe2.textContent="👢";

    }

    else{

        shoe1.innerHTML =
        '<img src="'+file+'" style="width:75px;height:45px;object-fit:contain;">';

        shoe2.innerHTML =
        '<img src="'+file+'" style="width:75px;height:45px;object-fit:contain;">';

    }

    selectOption(button);
}



/* =================================
   SAVE
================================= */

function finish(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const age =
        document
        .getElementById("age")
        .value;

    const school =
        document
        .getElementById("school")
        .value;


    if(!name || !age || !school){

        alert(
            "Please complete your information ❤️"
        );

        return;

    }


    localStorage.setItem(
        "studyQuestName",
        name
    );

    localStorage.setItem(
        "studyQuestAge",
        age
    );

    localStorage.setItem(
        "studyQuestSchool",
        school
    );


    alert(
        "Your character is ready! 🎉"
    );

}

</script>

</body>
</html>
