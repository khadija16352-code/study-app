<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Quest</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffd9ec,#ddd7ff);
    color:#29263d;
}

.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.creator{
    width:100%;
    max-width:1100px;
    min-height:700px;
    background:rgba(255,255,255,.93);
    border-radius:32px;
    overflow:hidden;
    display:grid;
    grid-template-columns:420px 1fr;
    box-shadow:0 25px 70px rgba(60,40,100,.16);
}

/* =====================
   PREVIEW
===================== */

.preview{
    background:linear-gradient(160deg,#ffd5e8,#e3d9ff);
    padding:35px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
}

.preview h1{
    font-size:27px;
    margin-bottom:8px;
}

.preview p{
    color:#777;
    margin-bottom:20px;
}

.character-stage{
    width:300px;
    height:430px;
    background:rgba(255,255,255,.55);
    border-radius:30px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.character{
    width:220px;
    height:390px;
    position:relative;
}

/* =====================
   CHARACTER BODY
===================== */

.head{
    position:absolute;
    width:115px;
    height:125px;
    border-radius:50%;
    background:#f2b58e;
    top:38px;
    left:52px;
    z-index:4;
}

.body{
    position:absolute;
    width:145px;
    height:175px;
    border-radius:50px 50px 25px 25px;
    background:#ff8fc0;
    top:155px;
    left:37px;
    z-index:2;
}

.leg{
    position:absolute;
    width:43px;
    height:105px;
    background:#f2b58e;
    border-radius:20px;
    top:300px;
    z-index:1;
}

.leg.left{
    left:62px;
}

.leg.right{
    left:115px;
}

.face{
    position:absolute;
    top:88px;
    left:77px;
    z-index:8;
    font-size:32px;
}

.hair{
    position:absolute;
    width:135px;
    height:130px;
    top:25px;
    left:42px;
    border-radius:65px 65px 35px 35px;
    background:#4b2d25;
    z-index:6;
}

/* Hair styles */

.hair.style2{
    width:155px;
    height:170px;
    left:32px;
    border-radius:70px;
}

.hair.style3{
    width:125px;
    height:115px;
    left:47px;
    background:#171717;
}

.hair.style4{
    width:145px;
    height:145px;
    left:37px;
    background:#8b4b27;
    border-radius:50%;
}

/* =====================
   BOY
===================== */

.character.boy .body{
    background:#63a9e8;
}

.character.boy .hair{
    height:90px;
    top:30px;
    border-radius:55px 55px 20px 20px;
}

.character.boy .hair.style2{
    height:105px;
    background:#222;
}

.character.boy .hair.style3{
    width:125px;
    height:100px;
    background:#75452e;
}

.character.boy .hair.style4{
    width:145px;
    height:100px;
    background:#d39b51;
}

/* =====================
   CLOTHES
===================== */

.outfit{
    position:absolute;
    top:155px;
    left:37px;
    width:145px;
    height:175px;
    border-radius:50px 50px 25px 25px;
    z-index:3;
}

.outfit.pink{
    background:#ff75b3;
}

.outfit.purple{
    background:#9675e8;
}

.outfit.blue{
    background:#4c9de8;
}

.outfit.green{
    background:#67bd9a;
}

.outfit.black{
    background:#35384d;
}

/* =====================
   SHOES
===================== */

.shoes{
    position:absolute;
    bottom:0;
    z-index:7;
    font-size:34px;
}

.shoes.left{
    left:45px;
}

.shoes.right{
    left:112px;
}

/* =====================
   BAG
===================== */

.bag{
    position:absolute;
    top:190px;
    right:5px;
    font-size:48px;
    z-index:10;
}

/* =====================
   ACCESSORY
===================== */

.accessory{
    position:absolute;
    top:88px;
    left:103px;
    z-index:11;
    font-size:28px;
}

/* =====================
   CONTROLS
===================== */

.controls{
    padding:38px;
    overflow-y:auto;
    max-height:700px;
}

.logo{
    font-size:30px;
    font-weight:800;
}

.subtitle{
    color:#777;
    margin:6px 0 25px;
}

.section{
    margin-bottom:25px;
}

.title{
    font-weight:bold;
    margin-bottom:12px;
}

.gender{
    display:flex;
    gap:10px;
}

.gender button{
    flex:1;
    border:2px solid #eee;
    background:white;
    padding:13px;
    border-radius:13px;
    cursor:pointer;
    font-size:15px;
}

.gender button.active{
    border-color:#9075ff;
    background:#f3efff;
}

.options{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.option{
    min-width:85px;
    min-height:70px;
    border:2px solid #eee;
    border-radius:15px;
    background:white;
    cursor:pointer;
    padding:10px;
    transition:.2s;
}

.option:hover{
    transform:translateY(-3px);
}

.option.active{
    border-color:#9075ff;
    background:#f3efff;
}

.option .emoji{
    font-size:25px;
    display:block;
    margin-bottom:5px;
}

.info{
    display:grid;
    gap:10px;
}

input,select{
    width:100%;
    padding:14px;
    border:2px solid #eee;
    border-radius:13px;
    font-size:15px;
    outline:none;
}

.continue{
    width:100%;
    padding:16px;
    border:0;
    border-radius:15px;
    background:#806cff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

/* MOBILE */

@media(max-width:800px){

    .creator{
        grid-template-columns:1fr;
    }

    .preview{
        min-height:520px;
    }

    .controls{
        max-height:none;
    }
}
</style>
</head>

<body>

<div class="page">

<div class="creator">

<!-- =====================
     CHARACTER PREVIEW
===================== -->

<div class="preview">

    <h1>✨ Your Character</h1>
    <p>Build your own study buddy</p>

    <div class="character-stage">

        <div id="character" class="character">

            <div id="hair" class="hair"></div>

            <div class="head"></div>

            <div class="face">😊</div>

            <div id="outfit" class="outfit pink"></div>

            <div class="leg left"></div>
            <div class="leg right"></div>

            <div id="bag" class="bag"></div>

            <div id="accessory" class="accessory"></div>

            <div class="shoes left">👟</div>
            <div class="shoes right">👟</div>

        </div>

    </div>

</div>


<!-- =====================
     OPTIONS
===================== -->

<div class="controls">

    <div class="logo">
        📚 Study Quest
    </div>

    <div class="subtitle">
        Create your profile and customize your character.
    </div>


    <!-- LANGUAGE -->

    <div class="section">

        <div class="title">🌍 Language</div>

        <div class="gender">

            <button class="active">
                🇬🇧 English
            </button>

            <button>
                🇪🇬 العربية
            </button>

        </div>

    </div>


    <!-- INFORMATION -->

    <div class="section">

        <div class="title">👤 Your information</div>

        <div class="info">

            <input
                id="name"
                placeholder="Your name">

            <input
                id="age"
                type="number"
                placeholder="Your age">

            <select id="school">

                <option value="">
                    School year
                </option>

                <option>Primary 1</option>
                <option>Primary 2</option>
                <option>Primary 3</option>
                <option>Primary 4</option>
                <option>Primary 5</option>
                <option>Primary 6</option>

                <option>Preparatory 1</option>
                <option>Preparatory 2</option>
                <option>Preparatory 3</option>

                <option>Secondary 1</option>
                <option>Secondary 2</option>
                <option>Secondary 3</option>

            </select>

        </div>

    </div>


    <!-- GENDER -->

    <div class="section">

        <div class="title">👤 Character</div>

        <div class="gender">

            <button
                id="girlBtn"
                class="active"
                onclick="chooseGender('girl')">
                👧 Girl
            </button>

            <button
                id="boyBtn"
                onclick="chooseGender('boy')">
                👦 Boy
            </button>

        </div>

    </div>


    <!-- CHARACTER -->

    <div class="section">

        <div class="title">
            🧍 Choose your character
        </div>

        <div class="options">

            <button class="option active"
                onclick="characterChoice(1)">
                <span class="emoji">👧</span>
                Girl 1
            </button>

            <button class="option"
                onclick="characterChoice(2)">
                <span class="emoji">👩</span>
                Girl 2
            </button>

            <button class="option"
                onclick="characterChoice(3)">
                <span class="emoji">👱‍♀️</span>
                Girl 3
            </button>

        </div>

    </div>


    <!-- HAIR -->

    <div class="section">

        <div class="title">
            💇 Hair
        </div>

        <div class="options">

            <button
                class="option active"
                onclick="hairChoice(1)">
                <span class="emoji">💇</span>
                Style 1
            </button>

            <button
                class="option"
                onclick="hairChoice(2)">
                <span class="emoji">👩‍🦱</span>
                Curly
            </button>

            <button
                class="option"
                onclick="hairChoice(3)">
                <span class="emoji">👩‍🦰</span>
                Short
            </button>

            <button
                class="option"
                onclick="hairChoice(4)">
                <span class="emoji">👱</span>
                Blonde
            </button>

        </div>

    </div>


    <!-- OUTFIT -->

    <div class="section">

        <div class="title">
            👗 Outfit
        </div>

        <div class="options">

            <button
                class="option active"
                onclick="outfitChoice('pink')">
                <span class="emoji">👗</span>
                Pink
            </button>

            <button
                class="option"
                onclick="outfitChoice('purple')">
                <span class="emoji">💜</span>
                Purple
            </button>

            <button
                class="option"
                onclick="outfitChoice('blue')">
                <span class="emoji">💙</span>
                Blue
            </button>

            <button
                class="option"
                onclick="outfitChoice('green')">
                <span class="emoji">💚</span>
                Green
            </button>

        </div>

    </div>


    <!-- ACCESSORIES -->

    <div class="section">

        <div class="title">
            ✨ Accessories
        </div>

        <div class="options">

            <button
                class="option"
                onclick="accessoryChoice('👓')">
                <span class="emoji">👓</span>
                Glasses
            </button>

            <button
                class="option"
                onclick="accessoryChoice('🎀')">
                <span class="emoji">🎀</span>
                Bow
            </button>

            <button
                class="option"
                onclick="accessoryChoice('🎧')">
                <span class="emoji">🎧</span>
                Headphones
            </button>

            <button
                class="option"
                onclick="accessoryChoice('⭐')">
                <span class="emoji">⭐</span>
                Star
            </button>

            <button
                class="option"
                onclick="accessoryChoice('')">
                <span class="emoji">🚫</span>
                None
            </button>

        </div>

    </div>


    <!-- BAG -->

    <div class="section">

        <div class="title">
            🎒 Bag
        </div>

        <div class="options">

            <button
                class="option"
                onclick="bagChoice('🎒')">
                <span class="emoji">🎒</span>
                Backpack
            </button>

            <button
                class="option"
                onclick="bagChoice('👜')">
                <span class="emoji">👜</span>
                Bag
            </button>

            <button
                class="option"
                onclick="bagChoice('💼')">
                <span class="emoji">💼</span>
                Classic
            </button>

            <button
                class="option"
                onclick="bagChoice('')">
                <span class="emoji">🚫</span>
                None
            </button>

        </div>

    </div>


    <!-- SHOES -->

    <div class="section">

        <div class="title">
            👟 Shoes
        </div>

        <div class="options">

            <button
                class="option"
                onclick="shoesChoice('👟')">
                <span class="emoji">👟</span>
                Sneakers
            </button>

            <button
                class="option"
                onclick="shoesChoice('👢')">
                <span class="emoji">👢</span>
                Boots
            </button>

            <button
                class="option"
                onclick="shoesChoice('🥿')">
                <span class="emoji">🥿</span>
                Classic
            </button>

        </div>

    </div>


    <button
        class="continue"
        onclick="finish()">
        Continue →
    </button>

</div>

</div>
</div>


<script>

let gender = "girl";
let characterNumber = 1;


/* =====================
   GENDER
===================== */

function chooseGender(type){

    gender = type;

    document
        .getElementById("girlBtn")
        .classList.toggle(
            "active",
            type === "girl"
        );

    document
        .getElementById("boyBtn")
        .classList.toggle(
            "active",
            type === "boy"
        );

    const character =
        document.getElementById("character");

    if(type === "boy"){
        character.classList.add("boy");
    }else{
        character.classList.remove("boy");
    }
}


/* =====================
   CHARACTER
===================== */

function characterChoice(number){

    characterNumber = number;

    document
        .querySelectorAll(".options")
        [3]
        ?.querySelectorAll(".option")
        .forEach((x,i)=>{
            x.classList.toggle(
                "active",
                i === number-1
            );
        });
}


/* =====================
   HAIR
===================== */

function hairChoice(number){

    const hair =
        document.getElementById("hair");

    hair.className =
        "hair style" + number;
}


/* =====================
   OUTFIT
===================== */

function outfitChoice(type){

    document
        .getElementById("outfit")
        .className =
        "outfit " + type;
}


/* =====================
   ACCESSORY
===================== */

function accessoryChoice(value){

    document
        .getElementById("accessory")
        .textContent = value;
}


/* =====================
   BAG
===================== */

function bagChoice(value){

    document
        .getElementById("bag")
        .textContent = value;
}


/* =====================
   SHOES
===================== */

function shoesChoice(value){

    document
        .querySelectorAll(".shoes")
        .forEach(x=>{
            x.textContent = value;
        });
}


/* =====================
   SAVE
===================== */

function finish(){

    const name =
        document.getElementById("name")
        .value.trim();

    const age =
        document.getElementById("age")
        .value;

    const school =
        document.getElementById("school")
        .value;

    if(!name || !age || !school){

        alert(
            "Please complete your information ❤️"
        );

        return;
    }

    localStorage.setItem(
        "studyQuestName",
        name
    );

    localStorage.setItem(
        "studyQuestAge",
        age
    );

    localStorage.setItem(
        "studyQuestSchool",
        school
    );

    localStorage.setItem(
        "studyQuestGender",
        gender
    );

    localStorage.setItem(
        "studyQuestCharacter",
        characterNumber
    );

    alert(
        "Your character is ready! 🎉"
    );
}

</script>

</body>
</html>
